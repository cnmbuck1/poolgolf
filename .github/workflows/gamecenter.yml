# Creates Rack & Roll's Game Center leaderboards and achievements in App Store Connect from
# tools/gamecenter/catalog.json. Run it by hand: GitHub → Actions → "Set up Game Center" → Run workflow.
# Leave "apply" unticked for a dry run that only lists what it would create. Safe to run again:
# anything that already exists is skipped. Uses the same App Store Connect API key secrets as
# "iPhone build to TestFlight" (ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY).
name: Set up Game Center
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create them for real (unticked = dry run, nothing changes)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gamecenter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check the branch has the Game Center catalog
        run: |
          if [ ! -f tools/gamecenter/catalog.json ]; then
            echo "::error::No tools/gamecenter/catalog.json on '${{ github.ref_name }}'. Run this on the release-1.1 branch (Use workflow from → release-1.1)."
            exit 1
          fi
      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Create leaderboards and achievements
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" -u tools/gamecenter/setup.py "$RUNNER_TEMP/keys/AuthKey.p8" "$KEY_ID" "$ISSUER_ID" $APPLY
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
