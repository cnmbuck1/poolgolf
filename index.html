<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a110b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pool Golf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;600;800;900&display=swap" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Icons, referenced with <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 4h11l-3 4 3 4H7z" fill="currentColor"/></symbol>
      <symbol id="i-cue" viewBox="0 0 24 24"><path d="M3 21L19 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="20.5" cy="3.5" r="1.8" fill="currentColor"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v5a5 5 0 0 1-10 0z" fill="currentColor"/><path d="M7 5H4a3 3 0 0 0 3 4M17 5h3a3 3 0 0 1-3 4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13v4M8 21h8l-1-3H9z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2l1.6 2.6 3-.7.7 3 2.6 1.6-1.4 2.5 1.4 2.5-2.6 1.6-.7 3-3-.7L12 22l-1.6-2.6-3 .7-.7-3L4.1 15.5 5.5 13 4.1 10.5l2.6-1.6.7-3 3 .7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-stats" viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8" rx="1" fill="currentColor"/><rect x="10" y="6" width="4" height="14" rx="1" fill="currentColor"/><rect x="16" y="9" width="4" height="11" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-friends" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4" fill="currentColor"/><circle cx="16.5" cy="9" r="2.6" fill="currentColor"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0zM14 20a5 5 0 0 1 8 0z" fill="currentColor"/></symbol>
      <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 4h3l2.4 11h10.6l2-8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.4" fill="currentColor"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.4" fill="currentColor"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M18.5 12a6.5 6.5 0 1 1-2.1-4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 3v5.5h-5.5z" fill="currentColor"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    </svg>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud-card glass">
        <div class="hud-hole"><span class="label">HOLE</span><b id="hud-hole" class="num">1</b></div>
        <div class="hud-meta">
          <span class="hud-name" id="hud-name"></span>
          <span class="hud-pips" id="hud-pips" aria-label="Round progress"></span>
        </div>
        <div class="hud-div"></div>
        <div class="hud-stat"><span class="label">PAR</span><b id="hud-par" class="num">3</b></div>
        <div class="hud-stat"><span class="label">STROKES</span><b id="hud-strokes" class="num">0</b></div>
        <div class="hud-stat"><span class="label">ROUND</span><b id="hud-topar" class="num chip">E</b></div>
      </div>
      <div class="hud-actions">
        <button id="btn-view" class="round-btn" aria-label="Switch camera view"><svg><use href="#i-camera"/></svg><span id="view-label">TOP</span></button>
        <button id="btn-restart" class="round-btn" aria-label="Restart hole"><svg><use href="#i-restart"/></svg></button>
        <button id="btn-pause" class="round-btn" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      </div>

      <div id="hint" class="hint glass"><span class="dot"></span>Pull back anywhere · release to shoot</div>

      <div class="power glass" aria-label="Shot power">
        <div class="power-label">POWER <b id="power-pct">0%</b></div>
        <div class="power-track">
          <div id="power-fill" class="power-fill"></div>
          <i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i>
        </div>
      </div>

      <div id="banner" class="banner">
        <div class="banner-hole"><span></span>HOLE <b id="banner-num">1</b><span></span></div>
        <div class="banner-name" id="banner-name"></div>
        <div class="banner-par" id="banner-par"></div>
      </div>
      <div id="toast" class="toast"></div>
      <div id="finger" class="finger hidden"><span></span></div>
    </div>

    <!-- Main menu -->
    <div id="screen-title" class="screen title">
      <div class="title-top">
        <button class="round-btn" id="btn-title-sound" aria-label="Sound on"><svg><use href="#i-sound"/></svg></button>
        <button class="round-btn" id="btn-more" aria-label="How to play"><svg><use href="#i-more"/></svg></button>
      </div>
      <div class="title-col">
        <h1 class="logo" aria-label="Pool Golf">
          <span class="logo-pool"><i></i>POOL<i></i></span>
          <span class="logo-golf" aria-hidden="true">G<span class="logo-ball"><span>8</span></span>LF</span>
        </h1>
        <p class="tagline">AIM · BANK · AVOID · SINK</p>
        <button class="btn-gold" id="btn-play">PLAY 6 HOLES<svg><use href="#i-chev"/></svg></button>
        <div class="menu-rows">
          <button class="menu-row" id="btn-courses"><svg class="ico"><use href="#i-flag"/></svg><span>COURSES</span><svg class="chev"><use href="#i-chev"/></svg></button>
          <button class="menu-row" id="btn-cues"><svg class="ico"><use href="#i-cue"/></svg><span>CUES &amp; BALLS</span><svg class="chev"><use href="#i-chev"/></svg></button>
          <button class="menu-row" id="btn-achievements"><svg class="ico"><use href="#i-trophy"/></svg><span>ACHIEVEMENTS</span><svg class="chev"><use href="#i-chev"/></svg></button>
        </div>
        <div class="icon-row">
          <button class="sq-btn" id="btn-settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
          <button class="sq-btn" id="btn-stats" aria-label="Stats"><svg><use href="#i-stats"/></svg></button>
          <button class="sq-btn" id="btn-friends" aria-label="Friends"><svg><use href="#i-friends"/></svg></button>
          <button class="sq-btn" id="btn-shop" aria-label="Shop"><svg><use href="#i-cart"/></svg></button>
        </div>
        <p class="best" id="best"></p>
      </div>
    </div>

    <!-- Generic sheet for menu panels (courses, settings, stats, info) -->
    <div id="screen-sheet" class="screen hidden">
      <div class="panel sheet">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="round-btn small" id="btn-sheet-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>

    <!-- Pause / settings -->
    <div id="screen-pause" class="screen hidden">
      <div class="panel">
        <h2>Paused</h2>
        <div class="settings">
          <button class="toggle" id="set-sound" aria-pressed="true"><span>Sound</span><em></em></button>
          <button class="toggle" id="set-guide" aria-pressed="true"><span>Bank guide</span><em></em></button>
          <button class="toggle" id="set-follow" aria-pressed="true"><span>Camera follows ball</span><em></em></button>
        </div>
        <div class="row">
          <button class="btn" id="btn-pause-restart">Restart hole</button>
          <button class="btn" id="btn-quit">Main menu</button>
        </div>
        <button class="btn-gold" id="btn-resume">RESUME<svg><use href="#i-chev"/></svg></button>
      </div>
    </div>

    <!-- Hole complete -->
    <div id="screen-hole" class="screen hidden">
      <div class="panel result">
        <div class="result-kicker" id="hole-kicker">HOLE 1</div>
        <h2 id="hole-result">Par</h2>
        <p id="hole-detail" class="detail"></p>
        <div id="hole-card" class="card-wrap"></div>
        <div class="row">
          <button class="btn" id="btn-replay">Replay hole</button>
          <button class="btn-gold" id="btn-next">NEXT HOLE<svg><use href="#i-chev"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Rotate prompt (web / tablets in portrait) -->
    <div id="rotate" class="rotate"><div><span class="rotate-icon">⟳</span><p>Turn your phone sideways to play</p></div></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
