<!doctype html>
<!-- Rack & Roll brand art: the app icon and splash screen, rendered to PNG by assets-src/brand/render.cjs. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@800&family=Saira:wght@800;900&display=block">
<style>
  html, body { margin: 0; background: transparent; }
  .felt { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #2f9a5a 0%, #1d7a44 45%, #0e4a28 100%); }
  .felt::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px); }
  .dark { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #2a5a3a 0%, #143422 45%, #0b1d14 100%); }
  .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; line-height: 0.86; font-family: 'Saira', sans-serif; font-weight: 900; }
  .top { display: flex; align-items: center; gap: 0.3em; width: 100%; font-size: 0.39em; letter-spacing: 0.14em; color: #f2b84a; background: linear-gradient(180deg, #fff1b8 10%, #f2b84a 55%, #b9771b); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0.02em 0 #5a3507); }
  .top i { flex: 1; height: 0.08em; border-radius: 1em; background: linear-gradient(90deg, transparent, #f2b84a); }
  .top i:last-child { transform: scaleX(-1); }
  .main { display: flex; align-items: center; font-size: 1em; background: linear-gradient(180deg, #ffffff 25%, #dfe5ea 55%, #9aa6b1 62%, #e8edf1 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0.03em 0 #4b5560) drop-shadow(0 0.055em 0 #2a3038) drop-shadow(0 0.12em 0.2em rgba(0,0,0,0.6)); }
  .ball { display: inline-grid; place-items: center; width: 0.74em; height: 0.74em; margin: 0 0.03em; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #6c6c6c 0, #1c1c1c 32%, #050505 70%); box-shadow: inset -0.06em -0.08em 0.14em rgba(0,0,0,0.6); -webkit-text-fill-color: initial; }
  .ball span { display: grid; place-items: center; width: 0.86em; height: 0.86em; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #e9e3d4); color: #111; -webkit-text-fill-color: #111; font-family: 'Saira Condensed', sans-serif; font-size: 0.42em; font-weight: 800; line-height: 1; }
  .tag { margin-top: 0.5em; font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-size: 0.16em; letter-spacing: 0.3em; color: #e8f0e8; }
</style></head>
<body>
<div id="art"></div>
<script>
const P = new URLSearchParams(location.search), kind = P.get('kind'), W = +P.get('w'), H = +P.get('h');
const art = document.getElementById('art');
art.style.cssText = `position:relative;width:${W}px;height:${H}px;overflow:hidden`;
// "Tee off": the cue sends the 8-ball rolling at the flag on a bright green under a blue sky, in the game's
// cartoon style. (Other concepts, and this one, side by side: icon-concepts.html.)
const font = "font-family=\"Saira Condensed, sans-serif\" font-weight=\"800\"";
// One glossy 8-ball, shared by the concepts (cx, cy, r in the 100-unit icon space)
const ball = (id, cx, cy, r, rot = 0) => `
  <defs>
    <radialGradient id="${id}b" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#8a8a8a"/><stop offset="0.28" stop-color="#262626"/><stop offset="0.75" stop-color="#050505"/></radialGradient>
    <radialGradient id="${id}w" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e4dcc8"/></radialGradient>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="${r + 1.4}" fill="#000" opacity="0.9"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}b)"/>
  <g transform="rotate(${rot} ${cx} ${cy})">
    <circle cx="${cx - r * 0.12}" cy="${cy - r * 0.2}" r="${r * 0.44}" fill="url(#${id}w)"/>
    <text x="${cx - r * 0.12}" y="${cy - r * 0.2 + r * 0.2}" text-anchor="middle" ${font} font-size="${r * 0.62}" fill="#111">8</text>
  </g>
  <ellipse cx="${cx - r * 0.38}" cy="${cy - r * 0.52}" rx="${r * 0.26}" ry="${r * 0.13}" fill="#fff" opacity="0.28" transform="rotate(-32 ${cx - r * 0.38} ${cy - r * 0.52})"/>`;
const flag = (x, y, h, s = 1) => `
  <line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#2a1408" stroke-width="${3.6 * s}" stroke-linecap="round"/>
  <line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#fffaf0" stroke-width="${2 * s}" stroke-linecap="round"/>
  <path d="M${x + 0.6} ${y - h} Q ${x + 10 * s} ${y - h + 2 * s} ${x + 19 * s} ${y - h + 1 * s} Q ${x + 14 * s} ${y - h + 6 * s} ${x + 18 * s} ${y - h + 11 * s} Q ${x + 9 * s} ${y - h + 10 * s} ${x + 0.6} ${y - h + 11 * s} Z" fill="#ff3b3b" stroke="#2a1408" stroke-width="${1.4 * s}" stroke-linejoin="round"/>`;

const scene = `
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ff"/><stop offset="1" stop-color="#bfeaff"/></linearGradient>
      <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd36a"/><stop offset="1" stop-color="#1f9a45"/></linearGradient>
      <linearGradient id="cue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a24"/><stop offset="0.7" stop-color="#e9c48a"/><stop offset="0.86" stop-color="#f6ecd6"/><stop offset="0.87" stop-color="#2a6ad8"/></linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#sky)"/>
    <circle cx="80" cy="16" r="9" fill="#fff3a8"/>
    <path d="M0 52 Q 30 42 60 48 T 100 44 V100 H0 Z" fill="url(#grass)" stroke="#16702f" stroke-width="1.2"/>
    <ellipse cx="74" cy="56" rx="9" ry="3" fill="#123d1c"/>
    ${flag(74, 56, 34)}
    <g stroke="#fff" stroke-linecap="round" stroke-width="3" opacity="0.85"><line x1="6" y1="66" x2="20" y2="66"/><line x1="3" y1="75" x2="18" y2="75"/><line x1="8" y1="84" x2="20" y2="84"/></g>
    <g transform="rotate(-14 22 92)"><rect x="-40" y="86" width="62" height="7" rx="3.5" fill="url(#cue)" stroke="#2a1408" stroke-width="1.2"/></g>
    ${ball('a', 42, 72, 19, -8)}`;
const icon = (bg) => `<svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%">${scene}</svg>`;
if (kind === 'icon') art.innerHTML = icon(true);
// The title logo itself as the icon: no tagline, sized to fill the square
const logoIcon = (fs) => `<div class="dark" style="background:radial-gradient(circle at 50% 45%, #2f6e45 0%, #17432a 50%, #0b2416 100%)"></div><div class="logo" style="font-size:${fs}px;top:53%"><span class="top"><i></i>RACK &amp;<i></i></span><span class="main">R<span class="ball"><span>8</span></span>LL</span></div>`;
if (kind === 'logoicon') art.innerHTML = logoIcon(Math.round(W * 0.285));
if (kind === 'fg') art.innerHTML = `<div style="position:absolute;inset:18%">${icon(false)}</div>`;
if (kind === 'splash') {
  const size = Math.min(W, H) * (W > H ? 0.2 : 0.17);
  art.innerHTML = `<div class="dark"></div><div class="logo" style="font-size:${size}px"><span class="top"><i></i>RACK &amp;<i></i></span><span class="main">R<span class="ball"><span>8</span></span>LL</span><span class="tag">AIM · BANK · AVOID · SINK</span></div>`;
}
document.fonts.ready.then(() => (document.body.dataset.ready = '1'));
</script>
</body></html>
